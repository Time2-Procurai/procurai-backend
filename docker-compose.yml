services:
  web:
    build: .
    container_name: procurai-backend
    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app
      - ./media:/app/media 

    ports:
      - "8080:8000"

    env_file:
      - .env

    environment:
      - EMAIL_USE_TLS=True
      - EMAIL_PORT=587
      - EMAIL_HOST=smtp-relay.brevo.com
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
      - KEY_SMTP=${KEY_SMTP}   

    depends_on:
      db:
        condition: service_healthy

    networks:
      procurai-network:
        aliases:
          - web

  db:
    image: postgres:16-alpine
    container_name: procurai-database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      procurai-network:
        aliases:
          - db

volumes:
  db_data:

networks:
  procurai-network:
    driver: bridge
